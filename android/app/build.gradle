// android/app/build.gradle
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // Processes google-services.json — required for firebase_core /
    // firebase_app_check to initialize correctly.
    id "com.google.gms.google-services"
}

def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.ludopromax.app"
    // Play requires new submissions to target API 36 (Android 16).
    compileSdk 36
    // Uses the NDK version bundled with this Flutter release. 16 KB alignment
    // comes from AGP 8.5.1+ plus the current Flutter engine and plugins; this
    // app has no native C/C++ code of its own.
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.ludopromax.app"
        // Play automatic protection requires minSdk 24 or higher.
        minSdkVersion 24
        targetSdkVersion 36
        // Each Play upload needs a higher versionCode than the last (last was 2).
        versionCode 3
        versionName "2.1.0"
        multiDexEnabled true
    }

    // Real signing config for release builds. Reads android/key.properties,
    // which CI writes from a GitHub secret before building. Falls back to the
    // debug config if key.properties is not present.
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Adds native debug symbols to the app bundle so Play Console
            // can show readable crash reports.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
        debug {
            debuggable true
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
}
