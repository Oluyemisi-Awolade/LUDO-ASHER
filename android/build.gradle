// android/build.gradle
// The Android Gradle Plugin, Kotlin and google-services plugin versions now
// live in android/settings.gradle, so the old buildscript block is removed.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
