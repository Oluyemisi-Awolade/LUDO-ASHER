name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Flutter 3.27+ is required (Color.withValues, in_app_purchase); 3.35 adds 16 KB page-size support.
      # Pinned so the build is repeatable and matches the Android Gradle
      # Plugin (8.9.1) and Kotlin (2.1.0) versions in android/settings.gradle.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_DB_URL=${{ secrets.FIREBASE_DB_URL }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludo-asher-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ── Play Store build (only runs once KEYSTORE_BASE64 secret exists) ──
      - name: Check for keystore secret
        id: keystore_check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode upload keystore
        if: steps.keystore_check.outputs.has_keystore == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # Diagnostic: proves the decoded keystore file, password and alias
      # work together before Gradle touches them.
      - name: Verify keystore is readable (diagnostic)
        if: steps.keystore_check.outputs.has_keystore == 'true'
        run: |
          echo "Keystore file size:"
          ls -la android/app/upload-keystore.jks
          echo "Attempting to list keystore contents with the stored password..."
          keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            | grep -E "Alias name|Valid from|SHA256"
          echo "✅ Keystore is valid and password/alias are correct."

      - name: Build App Bundle (Play Store)
        if: steps.keystore_check.outputs.has_keystore == 'true'
        run: |
          flutter build appbundle --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_DB_URL=${{ secrets.FIREBASE_DB_URL }}

      - name: Upload AAB artifact
        if: steps.keystore_check.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ludo-asher-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
