name: ludo_pro_max
description: Ludo Asher — professional multiplayer Ludo game
version: 2.1.0+4
publish_to: none

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9

  # UI
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0

  # Audio
  audioplayers: ^5.2.1

  # Persistence
  shared_preferences: ^2.2.2

  # Utils
  url_launcher: ^6.2.2
  http: ^1.2.1

  # In-app purchases (Support the Developer coffee tiers)
  in_app_purchase: ^3.3.0

  # Security — verifies requests come from the real, untampered app
  firebase_core: ^3.8.0
  firebase_app_check: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
